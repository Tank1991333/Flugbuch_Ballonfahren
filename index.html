<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
🎈 Flugbuch Ballonfahren
</title>

<link
rel="stylesheet"
href="https://unpkg.com/le.css

</head>

<body>

<h1>🎈 Flugbuch Ballonfahren</h1>

<div class="card">

<h2>Status</h2>

<p id="status">
Kein Flug aktiv
</p>

</div>

<div class="card">

<h2>📊 Statistik</h2>

<p>
Gesamtflüge:
<span id="countFlights">0</span>
</p>

<p>
Gesamtlandungen:
<span id="countLandings">0</span>
</p>

<p>
Gesamtflugzeit:
<span id="countMinutes">0h 0m</span>
</p>

</div>

<div id="weather"></div>

<div class="card">

<h2>👨‍✈️ Pilot & Ballon</h2>

<label>Pilot</label>

<input
type="text"
id="pilot"
placeholder="Pilot eingeben"
/>

<label>Ballon Kennzeichen</label>

<input
type="text"
id="ballon"
placeholder="z.B. OE-XYZ"
/>

</div>

<div class="card">

<h2>🚀 Flugsteuerung</h2>

<button onclick="flugStarten()">
Flug starten
</button>

<button onclick="flugBeenden()">
Flug beenden
</button>

<button onclick="flugSpeichern()">
Flug speichern
</button>

</div>

<div class="card">

<h2>📝 Flugdetails</h2>

<label>Landungen</label>

<input
type="number"
id="landungen"
value="1"
/>

<label>Bemerkung</label>

<textarea
id="bemerkung"
rows="4"
placeholder="Notizen zum Flug..."
></textarea>

</div>

<div class="card">

<h2>🗺 Flugkarte</h2>

<div id="map"></div>

<br>

<button onclick="aktuellePosition()">
📍 Aktuelle Position
</button>

<button onclick="routeLoeschen()">
🗑 Route löschen
</button>

</div>

<div class="card">

<h2>📖 Flugbuch</h2>

<div id="flugliste"></div>

</div>

https://unpkg.com/leaflet/dist/leaflet.jsscript>

<script src="map.js"></script>

<script src="weather.js"></script>

<script src="app.js"></script>

</body>

</html>
