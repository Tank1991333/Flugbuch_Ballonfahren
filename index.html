<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎈 FlightBook Balloon</title>

<link
rel="stylesheet"
href="t/leaflet.css

style.css

</head>

<body>

<header class="hero">

    <div class="hero-overlay">

        <h1>🎈 FlightBook Balloon</h1>

        <p>
            Digitales Flugbuch für Ballonfahrer
        </p>

        <div id="status" class="status-badge">
            Kein Flug aktiv
        </div>

    </div>

</header>

<section class="dashboard">

    <div class="stat-card">

        <div class="stat-icon">✈️</div>

        <div class="stat-title">
            Flüge
        </div>

        <div
        id="countFlights"
        class="stat-value"
        >
            0
        </div>

    </div>

    <div class="stat-card">

        <div class="stat-icon">🛬</div>

        <div class="stat-title">
            Landungen
        </div>

        <div
        id="countLandings"
        class="stat-value"
        >
            0
        </div>

    </div>

    <div class="stat-card">

        <div class="stat-icon">⏱️</div>

        <div class="stat-title">
            Flugzeit
        </div>

        <div
        id="countMinutes"
        class="stat-value"
        >
            0h 0m
        </div>

    </div>

</section>

<div id="weather"></div>

<section class="glass-card">

    <h2>👨‍✈️ Pilot & Ballon</h2>

    <div class="grid">

        <div>

            <label>Pilot</label>

            <input
            type="text"
            id="pilot"
            placeholder="Pilot eingeben"
            >

        </div>

        <div>

            <label>Ballon</label>

            <input
            type="text"
            id="ballon"
            placeholder="OE-XXX"
            >

        </div>

    </div>

</section>

<section class="glass-card">

    <h2>🚀 Flugsteuerung</h2>

    <div class="button-row">

        <button
        class="success"
        onclick="flugStarten()">
            Flug starten
        </button>

        <button
        class="warning"
        onclick="flugBeenden()">
            Flug beenden
        </button>

        <button
        class="primary"
        onclick="flugSpeichern()">
            Flug speichern
        </button>

    </div>

</section>

<section class="glass-card">

    <h2>📝 Flugdaten</h2>

    <label>Landungen</label>

    <input
    type="number"
    id="landungen"
    value="1"
    >

    <label>Bemerkung</label>

    <textarea
    id="bemerkung"
    rows="4"
    placeholder="Wetter, Besonderheiten, Gäste ..."
    ></textarea>

</section>

<section class="glass-card">

    <h2>🗺 Live Flugkarte</h2>

    <div id="map"></div>

    <div class="button-row">

        <button onclick="aktuellePosition()">
            📍 Position
        </button>

        <button onclick="routeLoeschen()">
            🗑 Route löschen
        </button>

    </div>

</section>

<section class="glass-card">

    <h2>📖 Flugbuch</h2>

    <div id="flugliste"></div>

</section>

https://unpkg.com/leaflet/dist/leaflet.jsscript>

<script src="map.js"></script>
<script src="weather.js"></script>
<script src="app.js"></script>

</body>
</html>
