<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🎈 Ballonflugbuch</title>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.css

<link
rel="stylesheet"
href="style.css"
/>

</head>

<body>

<header class="hero">
<h1>🎈 Ballonflugbuch</h1>
<p>Digitales Flugbuch für Heißluftballonfahrer</p>
</header>

<section class="dashboard">

<div class="stat">
<h3 id="countFlights">0</h3>
<p>Flüge</p>
</div>

<div class="stat">
<h3 id="countLandings">0</h3>
<p>Landungen</p>
</div>

<div class="stat">
<h3 id="countMinutes">0h</h3>
<p>Flugzeit</p>
</div>

</section>

<section class="card weather">

<h2>🌤 Wetter</h2>

<p id="temperature">Temperatur: --</p>

<p id="wind">Wind: --</p>

</section>

<section class="card">

<h2>👨‍✈️ Pilot & Ballon</h2>

<label>Pilot</label>

<input id="pilot">

<label>Kennzeichen</label>

<input id="ballon">

</section>

<section class="card">

<h2>📍 Tracking</h2>

<button onclick="flugStarten()" class="start">

▶ Fahrt starten

</button>

<button onclick="flugBeenden()" class="stop">

■ Fahrt beenden

</button>

<p id="status">Kein Flug aktiv</p>

</section>

<section class="card">

<h2>🗺 Karte</h2>

<div id="map"></div>

</section>

<section class="card">

<h2>📝 Flugdaten</h2>

<label>Landungen</label>

<input id="landungen" type="number" value="1" min="1">

<label>Bemerkungen</label>

<textarea id="bemerkung"></textarea>

<button onclick="flugSpeichern()" class="save">

Flug speichern

</button>

</section>

<section class="card">

<h2>📒 Flugbuch</h2>

<div id="flugliste"></div>

</section>

<script src="https://unpkg.com/leaflet@1flet.jsscript>

<script src="map.js"></script>
<script src="weather.js"></script>
<script src="app.js"></script>

</body>
</html>
