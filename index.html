<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🎈 Ballonflugbuch</title>

https://unpkg.com/leaflet/dist/leaflet.css

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#eef6ff;
padding:15px;
}

.hero{
background:linear-gradient(
rgba(0,0,0,.35),
rgba(0,0,0,.35)
),
url("https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?auto=format&fit=crop&w=1500&q=80");

background-size:cover;
background-position:center;

height:260px;

border-radius:20px;

display:flex;
flex-direction:column;
justify-content:center;

color:white;

padding:30px;

margin-bottom:20px;
}

.hero h1{
font-size:38px;
}

.hero p{
font-size:18px;
margin-top:10px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;

box-shadow:
0 8px 20px rgba(0,0,0,.08);
}

.dashboard{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:15px;

}

.stat{

background:#f4f8ff;

padding:15px;

border-radius:15px;

text-align:center;

}

.stat h3{
font-size:30px;
color:#005eff;
}

input,textarea{

width:100%;
padding:12px;

margin-top:5px;
margin-bottom:15px;

border:1px solid #ddd;
border-radius:10px;

}

button{

border:none;
padding:14px 20px;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}

.start{
background:#00a651;
color:white;
}

.stop{
background:#d60000;
color:white;
}

.save{
background:#005eff;
color:white;
width:100%;
}

#map{

height:400px;

border-radius:15px;

}

.flight{

background:#fafafa;
padding:15px;

border-left:
5px solid #005eff;

border-radius:10px;

margin-top:10px;

}

</style>

</head>

<body>

<div class="hero">

<h1>🎈 Ballonflugbuch</h1>

<p>
Digitales Flugbuch für Heißluftballonfahrer
</p>

</div>

<div class="card">

<h2>📊 Dashboard</h2>

<br>

<div class="dashboard">

<div class="stat">
<p>Flüge</p>
<h3 id="countFlights">0</h3>
</div>

<div class="stat">
<p>Landungen</p>
<h3 id="countLandings">0</h3>
</div>

<div class="stat">
<p>Flugminuten</p>
<h3 id="countMinutes">0</h3>
</div>

</div>

</div>

<div class="card">

<h2>👨‍✈️ Pilot & Ballon</h2>

<br>

<label>Pilot</label>
<input id="pilot">

<label>Ballon Kennzeichen</label>
<input id="ballon">

</div>

<div class="card">

<h2>📍 Tracking</h2>

<br>

<button
class="start"
onclick="flugStarten()">

▶ Fahrt starten

</button>

<button
class="stop"
onclick="flugBeenden()">

■ Fahrt beenden

</button>

<br><br>

<p id="status">
Kein Flug aktiv
</p>

</div>

<div class="card">

<h2>🗺 Karte</h2>

<br>

<div id="map"></div>

</div>

<div class="card">

<h2>📝 Flugdaten</h2>

<br>

<label>Landungen</label>

<input
id="landungen"
type="number"
value="1">

<label>Bemerkungen</label>

<textarea
id="bemerkung"
rows="4"></textarea>

<button
class="save"
onclick="flugSpeichern()">

Flug speichern

</button>

</div>

<div class="card">

<h2>📒 Flugbuch</h2>

<div id="flugliste"></div>

</div>

https://unpkg.com/leaflet/dist/leaflet.jsscript>

<script>

let fluege =
JSON.parse(
localStorage.getItem("fluege")
) || [];

let aktuellerFlug = null;

let startMarker = null;
let endMarker = null;

const map =
L.map('map')
.setView([47.285,15.98],10);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'OpenStreetMap'
}
).addTo(map);

anzeigeAktualisieren();

async function ortName(lat,lng){

try{

let response =
await fetch(
`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
);

let data =
await response.json();

return data.address.city ||
data.address.town ||
data.address.village ||
"Unbekannt";

}
catch{

return "Unbekannt";

}

}

function flugStarten(){

navigator.geolocation.getCurrentPosition(
async function(pos){

let ort =
await ortName(
pos.coords.latitude,
pos.coords.longitude
);

aktuellerFlug = {

datum:
new Date().toLocaleDateString(),

pilot:
document.getElementById("pilot").value,

ballon:
document.getElementById("ballon").value,

startzeit:
new Date(),

startLat:
pos.coords.latitude,

startLng:
pos.coords.longitude,

startOrt:
ort

};

if(startMarker)
map.removeLayer(startMarker);

startMarker =
L.marker([
pos.coords.latitude,
pos.coords.longitude
]).addTo(map);

map.setView(
[
pos.coords.latitude,
pos.coords.longitude
],
12
);

document.getElementById("status")
.innerHTML =
"✅ Fahrt läuft";

});
}

function flugBeenden(){

if(!aktuellerFlug){

alert("Bitte zuerst starten");

return;

}

navigator.geolocation.getCurrentPosition(
async function(pos){

let ort =
await ortName(
pos.coords.latitude,
pos.coords.longitude
);

aktuellerFlug.endezeit =
new Date();

aktuellerFlug.landeLat =
pos.coords.latitude;

aktuellerFlug.landeLng =
pos.coords.longitude;

aktuellerFlug.landeOrt =
ort;

if(endMarker)
map.removeLayer(endMarker);

endMarker =
L.marker([
pos.coords.latitude,
pos.coords.longitude
]).addTo(map);

document.getElementById("status")
.innerHTML =
"✅ Fahrt beendet";

});
}

function flugSpeichern(){

if(!aktuellerFlug ||
!aktuellerFlug.endezeit){

alert(
"Bitte Fahrt zuerst beenden"
);

return;

}

let minuten = Math.round(

(
aktuellerFlug.endezeit -
aktuellerFlug.startzeit
)

/

1000

/

60

);

aktuellerFlug.flugzeit =
minuten;

aktuellerFlug.landungen =
Number(
document.getElementById(
"landungen"
).value
);

aktuellerFlug.bemerkung =
document.getElementById(
"bemerkung"
).value;

fluege.push(
aktuellerFlug
);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

aktuellerFlug = null;

anzeigeAktualisieren();

}

function anzeigeAktualisieren(){

let html = "";

let gesamtFluege = fluege.length;

let gesamtLandungen = 0;

let gesamtZeit = 0;

fluege.forEach(flug=>{

gesamtLandungen +=
flug.landungen;

gesamtZeit +=
flug.flugzeit;

let stunden =
Math.floor(
flug.flugzeit / 60
);

let minuten =
flug.flugzeit % 60;

html += `

<div class="flight">

<b>${flug.datum}</b>

<br><br>

👨‍✈️ ${flug.pilot}

<br>

🎈 ${flug.ballon}

<br>

📍 ${flug.startOrt}

→

${flug.landeOrt}

<br>

⏱ ${stunden}h ${minuten}min

<br>

🛬 ${flug.landungen}

<br>

📝 ${flug.bemerkung}

</div>

`;

});

document.getElementById("flugliste")
.innerHTML = html;

document.getElementById("countFlights")
.innerHTML = gesamtFluege;

document.getElementById("countLandings")
.innerHTML = gesamtLandungen;

document.getElementById("countMinutes")
.innerHTML = gesamtZeit;

}

</script>

</body>
</html>
