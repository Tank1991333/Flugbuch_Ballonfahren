<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎈 Flugbuch Ballonfahren</title>

<style>

body{
    font-family:Arial, sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
    background:#f4f4f4;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#004fa3;
}

.flug{
    background:#f9f9f9;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
}

</style>

</head>

<body>

<h1>🎈 Flugbuch Ballonfahren</h1>

<div class="card">

<h2>📊 Statistik</h2>

<p id="anzahlFluege">
Gesamtflüge: 0
</p>

<p id="gesamtLandungen">
Gesamtlandungen: 0
</p>

</div>

<div class="card">

<h2>📍 GPS Tracking</h2>

<p id="position">
Position nicht verfügbar
</p>

<p id="hoehe">
Höhe: -
</p>

<p id="genauigkeit">
Genauigkeit: -
</p>

<button onclick="starteGPS()">
GPS starten
</button>

</div>

<div class="card">

<h2>📝 Neuer Flug</h2>

<label>Pilot</label>
<input type="text" id="pilot">

<label>Ballon Kennzeichen</label>
<input type="text" id="ballon">

<label>Datum</label>
<input type="date" id="datum">

<label>Startzeit</label>
<input type="time" id="start">

<label>Landezeit</label>
<input type="time" id="landung">

<label>Startort</label>
<input type="text" id="startort">

<label>Landeort</label>
<input type="text" id="landeort">

<label>Anzahl Landungen</label>
<input type="number" id="landungen">

<label>Bemerkung</label>
<textarea id="bemerkung"></textarea>

<button onclick="flugSpeichern()">
Flug speichern
</button>

</div>

<div class="card">

<h2>📖 Gespeicherte Flüge</h2>

<div id="flugliste"></div>

</div>

<script>

let fluege =
JSON.parse(localStorage.getItem("fluege")) || [];

anzeigen();

function starteGPS(){

if(!navigator.geolocation){
alert("GPS wird nicht unterstützt");
return;
}

navigator.geolocation.watchPosition(
zeigePosition,
gpsFehler,
{
enableHighAccuracy:true
}
);

}

function zeigePosition(position){

let breite =
position.coords.latitude.toFixed(6);

let laenge =
position.coords.longitude.toFixed(6);

let hoehe =
position.coords.altitude;

let genauigkeit =
Math.round(position.coords.accuracy);

let mapsLink =
`https://maps.google.com/?q=${breite},${laenge}`;

document.getElementById("position").innerHTML =
`
📍 ${breite}, ${laenge}<br>
<a href="${mapsLink}" target="_blank">
Karte öffnen
</a>
`;

document.getElementById("hoehe").innerHTML =
"🎈 Höhe: " +
(hoehe ? Math.round(hoehe) : "-") +
" m";

document.getElementById("genauigkeit").innerHTML =
"🎯 Genauigkeit: " +
genauigkeit +
" m";

}

function gpsFehler(error){

alert(
"GPS Fehler: " +
error.message
);

}

function flugSpeichern(){

let startZeit =
new Date(
"2000-01-01T" +
document.getElementById("start").value
);

let landeZeit =
new Date(
"2000-01-01T" +
document.getElementById("landung").value
);

let dauer =
(Math.abs(landeZeit - startZeit) / 1000 / 60);

let flug = {

pilot:
document.getElementById("pilot").value,

ballon:
document.getElementById("ballon").value,

datum:
document.getElementById("datum").value,

start:
document.getElementById("start").value,

landung:
document.getElementById("landung").value,

startort:
document.getElementById("startort").value,

landeort:
document.getElementById("landeort").value,

landungen:
document.getElementById("landungen").value,

bemerkung:
document.getElementById("bemerkung").value,

gps:
document.getElementById("position").innerText,

dauer:
Math.round(dauer) + " Minuten"

};

fluege.push(flug);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

anzeigen();

}

function anzeigen(){

let html = "";
let landungenSumme = 0;

fluege.forEach((flug,index)=>{

landungenSumme +=
Number(flug.landungen || 0);

html += `

<div class="flug">

<b>${flug.datum}</b>

<hr>

Pilot: ${flug.pilot}<br>
Ballon: ${flug.ballon}<br>

Startort: ${flug.startort}<br>
Landeort: ${flug.landeort}<br>

Startzeit: ${flug.start}<br>
Landezeit: ${flug.landung}<br>

Flugdauer: ${flug.dauer}<br>

Landungen: ${flug.landungen}<br>

GPS:<br>
${flug.gps}<br><br>

Bemerkung:<br>
${flug.bemerkung}<br><br>

<button onclick="loeschen(${index})">
🗑 Löschen
</button>

</div>

`;

});

document.getElementById("flugliste").innerHTML = html;

document.getElementById("anzahlFluege").innerText =
"Gesamtflüge: " + fluege.length;

document.getElementById("gesamtLandungen").innerText =
"Gesamtlandungen: " + landungenSumme;

}

function loeschen(index){

fluege.splice(index,1);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

anzeigen();

}

</script>

</body>
</html>
