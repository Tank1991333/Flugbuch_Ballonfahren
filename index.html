<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🎈 Ballonflugbuch</title>

<link
rel="stylesheet"
href="https://unpkget.css

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#eef6ff;
padding:15px;
}

.hero{
background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
url("https://images.unsplash.com/photo-1507608616759-54f48f0af0ee");

background-size:cover;
background-position:center;

height:260px;

border-radius:20px;

display:flex;
flex-direction:column;
justify-content:center;

padding:30px;

color:white;

margin-bottom:20px;
}

.hero h1{
font-size:40px;
}

.card{
background:white;

padding:20px;

border-radius:20px;

margin-bottom:20px;

box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.dashboard{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:15px;

}

.stat{
background:#f4f8ff;

padding:15px;

border-radius:15px;

text-align:center;
}

.stat h3{

font-size:28px;

color:#005eff;
}

input,
textarea{

width:100%;

padding:12px;

margin-top:5px;

margin-bottom:15px;

border:1px solid #ddd;

border-radius:10px;

}

button{

padding:12px 18px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

margin-right:5px;
}

.start{
background:#00a651;
color:white;
}

.stop{
background:#d60000;
color:white;
}

.save{
background:#005eff;
color:white;
width:100%;
}

.delete{
background:#666;
color:white;
margin-top:10px;
}

#map{

height:400px;

border-radius:15px;

}

.flight{

background:#fafafa;

padding:15px;

border-left:5px solid #005eff;

border-radius:12px;

margin-top:10px;

}

</style>

</head>

<body>

<div class="hero">

<h1>🎈 Ballonflugbuch</h1>

<p>
Digitales Flugbuch für Heißluftballonfahrer
</p>

</div>

<div class="card">

<h2>📊 Dashboard</h2>

<br>

<div class="dashboard">

<div class="stat">
<p>Flüge</p>
<h3 id="countFlights">0</h3>
</div>

<div class="stat">
<p>Landungen</p>
<h3 id="countLandings">0</h3>
</div>

<div class="stat">
<p>Gesamtzeit</p>
<h3 id="countMinutes">0h</h3>
</div>

</div>

</div>

<div class="card">

<h2>👨‍✈️ Pilot & Ballon</h2>

<br>

<label>Pilot</label>
<input id="pilot">

<label>Ballon Kennzeichen</label>
<input id="ballon">

</div>

<div class="card">

<h2>📍 Tracking</h2>

<br>

<button class="start" onclick="flugStarten()">
▶ Fahrt starten
</button>

<button class="stop" onclick="flugBeenden()">
■ Fahrt beenden
</button>

<br><br>

<p id="status">
Kein Flug aktiv
</p>

</div>

<div class="card">

<h2>🗺 Karte</h2>

<br>

<div id="map"></div>

</div>

<div class="card">

<h2>📝 Flugdaten</h2>

<br>

<label>Landungen</label>

<input
id="landungen"
type="number"
value="1">

<label>Bemerkungen</label>

<textarea
id="bemerkung"
rows="4"></textarea>

<button
class="save"
onclick="flugSpeichern()">

Flug speichern

</button>

</div>

<div class="card">

<h2>📒 Flugbuch</h2>

<div id="flugliste"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9et.jsscript>

<script>

let fluege =
JSON.parse(
localStorage.getItem("fluege")
) || [];

let aktuellerFlug = null;

let startMarker = null;
let landeMarker = null;

const map = L.map("map")
.setView([47.285,15.98],10);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

anzeigeAktualisieren();

async function ortName(lat,lng){

try{

const response =
await fetch(
`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
);

const data =
await response.json();

return (
data.address.city ||
data.address.town ||
data.address.village ||
data.address.hamlet ||
"Unbekannt"
);

}
catch{

return "Unbekannt";

}

}

function flugStarten(){

navigator.geolocation.getCurrentPosition(

async function(pos){

const ort =
await ortName(
pos.coords.latitude,
pos.coords.longitude
);

aktuellerFlug = {

datum:
new Date().toLocaleDateString(),

pilot:
document.getElementById("pilot").value,

ballon:
document.getElementById("ballon").value,

startzeit:
new Date(),

startLat:
pos.coords.latitude,

startLng:
pos.coords.longitude,

startOrt:
ort

};

if(startMarker){

map.removeLayer(startMarker);

}

startMarker =
L.marker([
pos.coords.latitude,
pos.coords.longitude
]).addTo(map);

map.setView(
[
pos.coords.latitude,
pos.coords.longitude
],
13
);

document.getElementById("status")
.innerHTML =
"✅ Fahrt läuft";

},

function(){

alert(
"GPS konnte nicht verwendet werden."
);

}

);

}

function flugBeenden(){

if(!aktuellerFlug){

alert("Bitte zuerst starten");

return;

}

navigator.geolocation.getCurrentPosition(

async function(pos){

const ort =
await ortName(
pos.coords.latitude,
pos.coords.longitude
);

aktuellerFlug.endezeit =
new Date();

aktuellerFlug.landeLat =
pos.coords.latitude;

aktuellerFlug.landeLng =
pos.coords.longitude;

aktuellerFlug.landeOrt =
ort;

if(landeMarker){

map.removeLayer(
landeMarker
);

}

landeMarker =
L.marker([
pos.coords.latitude,
pos.coords.longitude
]).addTo(map);

document.getElementById("status")
.innerHTML =
"✅ Fahrt beendet";

}

);

}

function flugSpeichern(){

if(
!aktuellerFlug ||
!aktuellerFlug.endezeit
){

alert(
"Bitte zuerst beenden"
);

return;

}

let minuten = Math.round(

(
aktuellerFlug.endezeit -
aktuellerFlug.startzeit
)

/

1000

/

60

);

aktuellerFlug.flugzeit =
minuten;

aktuellerFlug.landungen =
Number(
document.getElementById("landungen").value
);

aktuellerFlug.bemerkung =
document.getElementById("bemerkung").value;

fluege.push(
aktuellerFlug
);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

aktuellerFlug = null;

document.getElementById("bemerkung").value="";
document.getElementById("landungen").value=1;

anzeigeAktualisieren();

}

function loeschen(index){

if(
confirm(
"Flug wirklich löschen?"
)
){

fluege.splice(index,1);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

anzeigeAktualisieren();

}

}

function anzeigeAktualisieren(){

let html = "";

let gesamtZeit = 0;

let gesamtLandungen = 0;

fluege.forEach((flug,index)=>{

gesamtZeit += flug.flugzeit;

gesamtLandungen += flug.landungen;

let stunden =
Math.floor(
flug.flugzeit / 60
);

let minuten =
flug.flugzeit % 60;

html += `

<div class="flight">

<b>${flug.datum}</b>

<br><br>

👨‍✈️ ${flug.pilot}

<br>

🎈 ${flug.ballon}

<br>

📍 ${flug.startOrt}
→
${flug.landeOrt}

<br>

⏱ ${stunden}h ${minuten}min

<br>

🛬 ${flug.landungen}

<br>

📝 ${flug.bemerkung}

<br>

<button
class="delete"
onclick="loeschen(${index})">

Löschen

</button>

</div>

`;

});

let gesamtStd =
Math.floor(gesamtZeit/60);

let gesamtMin =
gesamtZeit%60;

document.getElementById(
"flugliste"
).innerHTML = html;

document.getElementById(
"countFlights"
).innerHTML = fluege.length;

document.getElementById(
"countLandings"
).innerHTML = gesamtLandungen;

document.getElementById(
"countMinutes"
).innerHTML =
gesamtStd + "h " +
gesamtMin + "m";

}

</script>

</body>
</html>
