<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flugbuch Ballonfahren</title>

<style>
body{
    font-family: Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f4f4f4;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin-bottom:15px;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:12px;
    border-radius:5px;
    cursor:pointer;
}

.flug{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
}
</style>

</head>
<body>

<h1>🎈 Flugbuch Ballonfahren</h1>

<div class="card">
<h2>Statistik</h2>

<p id="anzahlFluege">
Gesamtflüge: 0
</p>

<p id="gesamtLandungen">
Gesamtlandungen: 0
</p>

</div>

<div class="card">

<h2>Neuer Flug</h2>

<label>Pilot</label>
<input type="text" id="pilot">

<label>Ballon Kennzeichen</label>
<input type="text" id="ballon">

<label>Datum</label>
<input type="date" id="datum">

<label>Startzeit</label>
<input type="time" id="start">

<label>Landezeit</label>
<input type="time" id="landung">

<label>Startort</label>
<input type="text" id="startort">

<label>Landeort</label>
<input type="text" id="landeort">

<label>Landungen</label>
<input type="number" id="landungen">

<label>Bemerkung</label>
<textarea id="bemerkung"></textarea>

<button onclick="flugSpeichern()">
Flug speichern
</button>

</div>

<div class="card">
<h2>Gespeicherte Flüge</h2>
<div id="flugliste"></div>
</div>

<script>

let fluege =
JSON.parse(localStorage.getItem("fluege")) || [];

anzeigen();

function flugSpeichern(){

let flug = {

pilot:
document.getElementById("pilot").value,

ballon:
document.getElementById("ballon").value,

datum:
document.getElementById("datum").value,

start:
document.getElementById("start").value,

landung:
document.getElementById("landung").value,

startort:
document.getElementById("startort").value,

landeort:
document.getElementById("landeort").value,

landungen:
document.getElementById("landungen").value,

bemerkung:
document.getElementById("bemerkung").value
};

let startZeit =
new Date("2000-01-01T" + flug.start);

let landeZeit =
new Date("2000-01-01T" + flug.landung);

let dauer =
(landeZeit - startZeit) / 1000 / 60;

flug.dauer =
Math.round(dauer) + " Minuten";

fluege.push(flug);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

anzeigen();

}

function anzeigen(){

let html = "";
let landungenSumme = 0;

fluege.forEach((flug,index)=>{

landungenSumme +=
Number(flug.landungen || 0);

html += `
<div class="flug">

<b>${flug.datum}</b><br><br>

Pilot: ${flug.pilot}<br>
Ballon: ${flug.ballon}<br>

${flug.startort}
➜
${flug.landeort}<br>

Start: ${flug.start}<br>

Landung: ${flug.landung}<br>

Dauer: ${flug.dauer}<br>

Landungen: ${flug.landungen}<br>

Bemerkung: ${flug.bemerkung}<br><br>

<button onclick="loeschen(${index})">
Löschen
</button>

</div>
`;
});

document.getElementById("flugliste")
.innerHTML = html;

document.getElementById("anzahlFluege")
.innerText =
"Gesamtflüge: " + fluege.length;

document.getElementById("gesamtLandungen")
.innerText =
"Gesamtlandungen: " + landungenSumme;
}

function loeschen(index){

fluege.splice(index,1);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

anzeigen();
}

</script>

</body>
</html>
