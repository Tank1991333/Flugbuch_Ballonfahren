<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Flugbuch Ballonfahren PRO</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:15px;
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h1{
text-align:center;
}

input,textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
box-sizing:border-box;
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
margin:3px;
}

.start{
background:#28a745;
color:white;
}

.stop{
background:#dc3545;
color:white;
}

.save{
background:#0066cc;
color:white;
}

.delete{
background:#666;
color:white;
}

.flug{
padding:15px;
background:#fafafa;
border-radius:10px;
margin-top:10px;
border:1px solid #ddd;
}

.check{
margin-bottom:10px;
}

</style>

</head>

<body>

<h1>🎈 Flugbuch Ballonfahren PRO</h1>

<div class="card">

<h2>Dashboard</h2>

<p id="gesamtFluege">Gesamtflüge: 0</p>

<p id="gesamtZeit">Gesamtflugzeit: 0 Minuten</p>

</div>

<div class="card">

<h2>Pilot und Ballon</h2>

<label>Pilot</label>
<input id="pilot">

<label>Ballon Kennzeichen</label>
<input id="ballon">

</div>

<div class="card">

<h2>Checkliste</h2>

<div class="check">
<input type="checkbox"> Hülle geprüft
</div>

<div class="check">
<input type="checkbox"> Brenner geprüft
</div>

<div class="check">
<input type="checkbox"> Gas geprüft
</div>

<div class="check">
<input type="checkbox"> Funkgerät geprüft
</div>

<div class="check">
<input type="checkbox"> Wetter geprüft
</div>

</div>

<div class="card">

<h2>Tracking</h2>

<button class="start" onclick="startFlight()">

▶ Flug starten

</button>

<button class="stop" onclick="stopFlight()">

■ Flug beenden

</button>

<p id="status">
Kein Flug aktiv
</p>

</div>

<div class="card">

<h2>Flugdaten</h2>

<label>Landungen</label>

<input
type="number"
id="landungen"
value="1"
>

<label>Bemerkungen</label>

<textarea
id="bemerkung"
rows="4"
></textarea>

<button
class="save"
onclick="saveFlight()">

Flug speichern

</button>

</div>

<div class="card">

<h2>Flüge</h2>

<div id="flugliste"></div>

</div>

<script>

let fluege =
JSON.parse(localStorage.getItem("fluege"))
|| [];

let aktuellerFlug = null;

anzeigen();

function startFlight(){

navigator.geolocation.getCurrentPosition(function(pos){

aktuellerFlug = {

datum:new Date().toLocaleDateString(),

pilot:
document.getElementById("pilot").value,

ballon:
document.getElementById("ballon").value,

startzeit:new Date(),

startLat:pos.coords.latitude,

startLng:pos.coords.longitude

};

document.getElementById("status").innerHTML =
"✅ Flug aktiv";

});

}

function stopFlight(){

if(!aktuellerFlug){

alert("Kein Flug aktiv");

return;

}

navigator.geolocation.getCurrentPosition(function(pos){

aktuellerFlug.landezeit =
new Date();

aktuellerFlug.landeLat =
pos.coords.latitude;

aktuellerFlug.landeLng =
pos.coords.longitude;

document.getElementById("status").innerHTML =
"✅ Flug beendet";

});

}

function saveFlight(){

if(!aktuellerFlug){

alert("Bitte zuerst Flug starten");

return;

}

let minuten = Math.round(

(
aktuellerFlug.landezeit -
aktuellerFlug.startzeit
)

/1000/60

);

aktuellerFlug.flugzeit =
minuten;

aktuellerFlug.landungen =
document.getElementById("landungen").value;

aktuellerFlug.bemerkung =
document.getElementById("bemerkung").value;

fluege.push(aktuellerFlug);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

aktuellerFlug = null;

document.getElementById("bemerkung").value = "";

anzeigen();

}

function loeschen(index){

fluege.splice(index,1);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

anzeigen();

}

function anzeigen(){

let html = "";

let gesamtMinuten = 0;

fluege.forEach((flug,index)=>{

gesamtMinuten +=
Number(flug.flugzeit);

html += `

<div class="flug">

<b>${flug.datum}</b>

<br><br>

Pilot:
${flug.pilot}

<br>

Ballon:
${flug.ballon}

<br>

Flugzeit:
${flug.flugzeit} Minuten

<br>

Landungen:
${flug.landungen}

<br>

Start GPS:
${flug.startLat.toFixed(5)},
${flug.startLng.toFixed(5)}

<br>

Landung GPS:
${flug.landeLat.toFixed(5)},
${flug.landeLng.toFixed(5)}

<br>

Bemerkung:
${flug.bemerkung}

<br><br>

<button
class="delete"
onclick="loeschen(${index})">

Löschen

</button>

</div>

`;

});

document.getElementById("flugliste").innerHTML =
html;

document.getElementById("gesamtFluege").innerHTML =
"Gesamtflüge: " + fluege.length;

document.getElementById("gesamtZeit").innerHTML =
"Gesamtflugzeit: " + gesamtMinuten + " Minuten";

}

</script>

</body>
</html>
