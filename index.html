<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BalloonLog Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:#eef5ff;
padding:15px;
}

.hero{

background:
linear-gradient(
rgba(0,0,0,0.4),
rgba(0,0,0,0.4)
),

url("https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?auto=format&fit=crop&w=1500&q=80");

background-size:cover;
background-position:center;

height:280px;

border-radius:20px;

color:white;

display:flex;

flex-direction:column;

justify-content:center;

padding:30px;

margin-bottom:20px;
}

.hero h1{
font-size:38px;
}

.hero p{
margin-top:10px;
font-size:18px;
}

.card{

background:white;

padding:20px;

border-radius:20px;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

margin-bottom:20px;

}

.dashboard{

display:grid;

gap:15px;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

}

.stat{

background:#f5f8ff;

padding:15px;

border-radius:15px;

text-align:center;

}

.stat h3{
color:#0066cc;
font-size:28px;
}

input,
textarea{

width:100%;

padding:12px;

margin-top:5px;

margin-bottom:15px;

border:1px solid #ddd;

border-radius:10px;

}

button{

border:none;

padding:14px;

border-radius:12px;

cursor:pointer;

font-weight:bold;

}

.start{

background:#00b050;

color:white;

}

.stop{

background:#d60000;

color:white;

}

.save{

background:#0066ff;

color:white;

width:100%;

}

.flight{

padding:15px;

background:#fafafa;

border-radius:15px;

margin-top:10px;

border-left:5px solid #0066ff;

}

.weather{

background:linear-gradient(
135deg,
#4facfe,
#00f2fe);

color:white;

}

.map-placeholder{

height:200px;

background:#edf3ff;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

color:#888;

}

</style>
</head>

<body>

<div class="hero">

<h1>🎈 BalloonLog PRO</h1>

<p>
Digitales Flugbuch für Heißluftballonfahrer
</p>

</div>

<div class="card">

<h2>📊 Dashboard</h2>

<br>

<div class="dashboard">

<div class="stat">
<p>Flüge</p>
<h3 id="fluegeCount">0</h3>
</div>

<div class="stat">
<p>Landungen</p>
<h3 id="landungenCount">0</h3>
</div>

<div class="stat">
<p>Minuten</p>
<h3 id="flugzeitCount">0</h3>
</div>

</div>

</div>

<div class="card weather">

<h2>🌤 Wetter</h2>

<br>

<p id="wetter">
Wetterdaten werden geladen ...
</p>

</div>

<div class="card">

<h2>🎈 Pilot & Ballon</h2>

<br>

<label>Pilot</label>

<input id="pilot">

<label>Ballon Kennzeichen</label>

<input id="ballon">

</div>

<div class="card">

<h2>📍 Tracking</h2>

<br>

<button
class="start"
onclick="flugStarten()">

▶ Flug starten

</button>

<button
class="stop"
onclick="flugBeenden()">

■ Flug beenden

</button>

<br><br>

<p id="status">
Kein Flug aktiv
</p>

</div>

<div class="card">

<h2>📝 Flugdaten</h2>

<br>

<label>Landungen</label>

<input
id="landungen"
type="number"
value="1">

<label>Bemerkungen</label>

<textarea
id="bemerkung"
rows="4"></textarea>

<button
class="save"
onclick="flugSpeichern()">

Flug speichern

</button>

</div>

<div class="card">

<h2>🗺 Karte</h2>

<br>

<div class="map-placeholder">

Kartenansicht folgt in Version 5

</div>

</div>

<div class="card">

<h2>📒 Flugbuch</h2>

<br>

<div id="flugliste"></div>

</div>

<script>

let fluege =
JSON.parse(
localStorage.getItem("fluege")
) || [];

let aktuellerFlug = null;

dashboard();

wetterLaden();

function flugStarten(){

navigator.geolocation.getCurrentPosition(

function(pos){

aktuellerFlug={

datum:
new Date().toLocaleDateString(),

start:
new Date(),

pilot:
document.getElementById("pilot").value,

ballon:
document.getElementById("ballon").value,

startLat:
pos.coords.latitude,

startLng:
pos.coords.longitude

};

document.getElementById("status")
.innerHTML =
"✅ Flug läuft";

});

}

function flugBeenden(){

if(!aktuellerFlug){

alert("Kein Flug aktiv");

return;

}

navigator.geolocation.getCurrentPosition(

function(pos){

aktuellerFlug.ende =
new Date();

aktuellerFlug.landeLat =
pos.coords.latitude;

aktuellerFlug.landeLng =
pos.coords.longitude;

document.getElementById("status")
.innerHTML =
"✅ Flug beendet";

});

}

function flugSpeichern(){

if(!aktuellerFlug){

alert("Bitte Flug starten");

return;

}

let minuten = Math.round(

(
aktuellerFlug.ende -
aktuellerFlug.start
)

/1000/60

);

aktuellerFlug.flugzeit =
minuten;

aktuellerFlug.landungen =
Number(
document.getElementById(
"landungen"
).value
);

aktuellerFlug.bemerkung =
document.getElementById(
"bemerkung"
).value;

fluege.push(
aktuellerFlug
);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

aktuellerFlug=null;

dashboard();

}

function dashboard(){

let html="";

let gesamtZeit=0;

let gesamtLandungen=0;

fluege.forEach((flug)=>{

gesamtZeit +=
flug.flugzeit;

gesamtLandungen +=
flug.landungen;

html += `

<div class="flight">

<b>${flug.datum}</b>

<br><br>

👨‍✈️ Pilot:
${flug.pilot}

<br>

🎈 Ballon:
${flug.ballon}

<br>

⏱ Flugzeit:
${flug.flugzeit} Minuten

<br>

🛬 Landungen:
${flug.landungen}

<br>

📌 Start GPS:
${flug.startLat.toFixed(4)},
${flug.startLng.toFixed(4)}

<br>

📌 Landung GPS:
${flug.landeLat.toFixed(4)},
${flug.landeLng.toFixed(4)}

<br>

📝 ${flug.bemerkung}

</div>

`;

});

document.getElementById("flugliste")
.innerHTML=html;

document.getElementById("fluegeCount")
.innerHTML = fluege.length;

document.getElementById("landungenCount")
.innerHTML = gesamtLandungen;

document.getElementById("flugzeitCount")
.innerHTML = gesamtZeit;

}

function wetterLaden(){

navigator.geolocation.getCurrentPosition(

function(pos){

fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,wind_speed_10m`
)

.then(r=>r.json())

.then(data=>{

document.getElementById("wetter")
.innerHTML =

"🌡 Temperatur: "
+
data.current.temperature_2m
+
" °C<br><br>💨 Wind: "
+
data.current.wind_speed_10m
+
" km/h";

});

});

}

</script>

</body>
</html>
