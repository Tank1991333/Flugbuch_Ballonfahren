<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Flugbuch Ballonfahren Pro</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input,textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
box-sizing:border-box;
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
margin-right:10px;
}

.start{
background:green;
color:white;
}

.stop{
background:red;
color:white;
}

.save{
background:#0066cc;
color:white;
}

.delete{
background:#d9534f;
color:white;
}

.flug{
background:white;
padding:15px;
margin-top:10px;
border-radius:10px;
}

</style>
</head>

<body>

<h1>🎈 Flugbuch Ballonfahren PRO</h1>

<div class="card">

<h2>Statistik</h2>

<p id="totalFlights">Gesamtflüge: 0</p>

<p id="totalMinutes">Gesamtflugzeit: 0 Min.</p>

</div>

<div class="card">

<h2>Tracking</h2>

<button class="start" onclick="startFlight()">
▶ Flug starten
</button>

<button class="stop" onclick="stopFlight()">
■ Flug beenden
</button>

<p id="status">
Kein Flug aktiv
</p>

</div>

<div class="card">

<h2>Flugdaten</h2>

<label>Landungen</label>

<input type="number"
id="landungen"
value="1">

<label>Bemerkungen</label>

<textarea
id="bemerkung"
rows="4"></textarea>

<button class="save"
onclick="saveFlight()">

Flug speichern

</button>

</div>

<div class="card">

<h2>Gespeicherte Flüge</h2>

<div id="flugliste"></div>

</div>

<script>

let fluege =
JSON.parse(localStorage.getItem("fluege"))
|| [];

let aktuellerFlug = null;

updateView();

function startFlight(){

navigator.geolocation.getCurrentPosition(function(pos){

aktuellerFlug = {

datum: new Date().toLocaleDateString(),

startzeit: new Date(),

startLat: pos.coords.latitude,

startLng: pos.coords.longitude

};

document.getElementById("status").innerHTML =
"Flug läuft...";

});

}

function stopFlight(){

if(!aktuellerFlug){
alert("Kein Flug aktiv");
return;
}

navigator.geolocation.getCurrentPosition(function(pos){

aktuellerFlug.landezeit =
new Date();

aktuellerFlug.landeLat =
pos.coords.latitude;

aktuellerFlug.landeLng =
pos.coords.longitude;

document.getElementById("status").innerHTML =
"Flug beendet";

});

}

function saveFlight(){

if(!aktuellerFlug){
alert("Zuerst Flug aufzeichnen");
return;
}

let dauerMinuten = Math.round(

(
aktuellerFlug.landezeit -
aktuellerFlug.startzeit
)

/1000/60

);

aktuellerFlug.landungen =
document.getElementById("landungen").value;

aktuellerFlug.bemerkung =
document.getElementById("bemerkung").value;

aktuellerFlug.flugzeit =
dauerMinuten;

fluege.push(aktuellerFlug);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

aktuellerFlug = null;

document.getElementById("bemerkung").value="";

updateView();

}

function deleteFlight(index){

fluege.splice(index,1);

localStorage.setItem(
"fluege",
JSON.stringify(fluege)
);

updateView();

}

function updateView(){

let html = "";

let totalMinutes = 0;

fluege.forEach((flug,index)=>{

totalMinutes += Number(flug.flugzeit);

html += `

<div class="flug">

<b>${flug.datum}</b>

<br><br>

Flugzeit:
${flug.flugzeit} Minuten

<br>

Landungen:
${flug.landungen}

<br>

GPS Start:
${flug.startLat.toFixed(5)},
${flug.startLng.toFixed(5)}

<br>

GPS Landung:
${flug.landeLat.toFixed(5)},
${flug.landeLng.toFixed(5)}

<br>

Bemerkung:
${flug.bemerkung}

<br><br>

<button
class="delete"
onclick="deleteFlight(${index})">

Löschen

</button>

</div>

`;

});

document.getElementById("flugliste").innerHTML =
html;

document.getElementById("totalFlights").innerHTML =
"Gesamtflüge: " + fluege.length;

document.getElementById("totalMinutes").innerHTML =
"Gesamtflugzeit: " + totalMinutes + " Min.";

}

</script>

</body>
</html>
