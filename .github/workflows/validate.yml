name: Validate Ballonflugbuch

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript-Syntax prüfen
        run: |
          node --check app.js
          node --check sw.js
          node --check trajektoren.js
          node --check sync.js
          node --check firebase-config.js
          node --check verfolgen.js
          node --check geo.js
      - name: Erforderliche Dateien prüfen
        run: |
          for f in index.html style.css geo.js app.js trajektoren.js sync.js firebase-config.js sw.js verfolgen.html verfolgen.js datenschutz.html vendor/leaflet/leaflet.js vendor/leaflet/leaflet.css fonts/barlow-latin-400-normal.woff2 manifest.webmanifest favicon.svg apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png; do test -f "$f" || { echo "Fehlt: $f"; exit 1; }; done
          grep -q '<!DOCTYPE html>' index.html
          grep -q 'src="app.js"' index.html
      - name: JSON und Inhaltsschutz (CSP) prüfen
        run: |
          node -e 'for (const f of ["vercel.json", "manifest.webmanifest"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'
          node -e 'const s = require("fs").readFileSync("index.html", "utf8"), c = s.match(/<script>([\s\S]*?)<\/script>/)[1], h = require("crypto").createHash("sha256").update(c).digest("base64"); if (!s.includes("sha256-" + h)) { console.error("CSP-Hash des Inline-Skripts passt nicht, neu: sha256-" + h); process.exit(1); }'
      - name: Alle Dateien des Offline-Speichers vorhanden
        run: node -e 'const s = require("fs").readFileSync("sw.js", "utf8"), l = eval(s.match(/SHELL = (\[[\s\S]*?\]);/)[1]); const f = l.filter(x => x !== "./" && !require("fs").existsSync(x)); if (f.length) { console.error("Fehlt im Repo: " + f); process.exit(1); }'
      - name: Keine externen Schriften oder CDNs
        run: "! grep -n 'unpkg.com\\|fonts.googleapis\\|fonts.gstatic' index.html verfolgen.html datenschutz.html style.css"
