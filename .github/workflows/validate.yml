name: Validate Ballonflugbuch

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript-Syntax prüfen
        run: |
          node --check app.js
          node --check sw.js
          node --check trajektoren.js
      - name: Erforderliche Dateien prüfen
        run: |
          for f in index.html style.css app.js trajektoren.js sw.js manifest.webmanifest favicon.svg; do test -f "$f" || { echo "Fehlt: $f"; exit 1; }; done
          grep -q '<!DOCTYPE html>' index.html
          grep -q 'src="app.js"' index.html
