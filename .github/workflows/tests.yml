name: Tests Ballonflugbuch

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright installieren
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser-Tests (Desktop und Handy, Firebase als Attrappe)
        run: npm test
