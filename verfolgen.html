<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com/firebasejs/; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com https://nwy-tiles-api.prod.newaydata.com; connect-src 'self' https://*.googleapis.com; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8EF">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Ballon verfolgen</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="verfolger">
<header><h1>🎈 Ballon verfolgen</h1><button id="themeB" aria-label="Design wechseln">☾</button></header>
<main>
  <div class="card"><h2 id="vTitel">Verbindung wird hergestellt …</h2><p id="vStatus" class="status" role="status"></p></div>
  <div class="mapbox" id="vbox"><div id="map"></div></div>
  <div class="cards4">
    <div class="kc gruen"><small>▲ HÖHE</small><b id="vH">–</b><em>m</em></div>
    <div class="kc blau"><small>⏱ TEMPO</small><b id="vV">–</b><em>km/h</em></div>
    <div class="kc gelb"><small>◈ RICHTUNG</small><b id="vR">–</b><em id="vRu"></em></div>
    <div class="kc rot"><small>⌖ ZU DIR</small><b id="vD">–</b><em id="vDu">km</em></div>
  </div>
  <a id="vNav" class="btn ok gross" style="width:100%" target="_blank" rel="noopener noreferrer" hidden>🧭 Navigation zum Ballon starten</a>
  <p id="vUtm" class="note"></p>
  <p class="note">Live-Position aus dem Ballonflugbuch. Die Angaben können verzögert sein; im Korb kann die Verbindung abreißen. Deine eigene Position bleibt auf deinem Gerät.</p>
</main>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="geo.js"></script>
<script src="firebase-config.js"></script>
<script src="verfolgen.js"></script>
</body>
</html>
